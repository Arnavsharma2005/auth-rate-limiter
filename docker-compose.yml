services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth-dev-password}
    ports:
      # Loopback only: without the 127.0.0.1 prefix Docker publishes the port on every network interface
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Anyone who can write to Redis can create a refresh token for any user, so it needs a password
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev-password}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis-dev-password}   # lets the healthcheck's redis-cli log in
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
